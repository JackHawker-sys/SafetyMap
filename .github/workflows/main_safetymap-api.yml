# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - safetymap-api

on:
  push:
    branches:
      - "main"
    paths:
      - "safetymap-backend/**"
      - ".github/workflows/main_safetymap-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "microsoft"
          cache: "maven"

      - name: Build with Maven
        run: mvn -f safetymap-backend/pom.xml clean package -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: "${{ github.workspace }}/safetymap-backend/target/*.jar"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_82336F1011564D3485019E1B387854C9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B8C52355E024333A2E756999CB2000A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8247746F144C4E9B86CB9E05E7A50C80 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "safetymap-api"
          slot-name: "Production"
          package: "*.jar"
